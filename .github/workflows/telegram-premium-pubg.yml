name: Upload PUBG GL + KR to Saved Messages
run-name: "PUBG Premium: ${{ inputs.game }}"

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Upload BOTH games or just one"
        required: true
        default: both
        type: choice
        options:
          - both
          - gl
          - kr
      verify_only:
        description: "Only verify Premium login; do not upload"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Never let two runners use the SAME Telegram StringSession concurrently.
concurrency:
  group: one-off-telegram-premium-pubg
  cancel-in-progress: false

jobs:
  upload:
    name: "PUBG selected files - one runner/session"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
      PUBG_SELECTION: ${{ inputs.game }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r premium_telegram/requirements.txt

      - name: Validate JSON and reconnect/resume logic
        run: python -m unittest discover -s premium_telegram -p 'test_*.py' -v

      - name: Verify Premium and concurrently transfer PUBG games (progress every 5%)
        run: python premium_telegram/upload_pubg_both.py
