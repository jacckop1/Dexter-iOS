name: Upload PUBG GL to Saved Messages
run-name: "PUBG GL Premium Upload"

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Only verify Premium login - uncheck to upload GL"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: one-off-telegram-premium-pubg-gl
  cancel-in-progress: false

jobs:
  upload:
    name: "Upload PUBG GL (resume and 5 percent progress)"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r premium_telegram/requirements.txt
      - name: Validate GL metadata and retry logic
        run: python -m unittest discover -s premium_telegram -p 'test_*.py' -v
      - name: Verify Premium and upload PUBG GL only
        run: python premium_telegram/upload_pubg_gl.py
