name: Build Dexter IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dexter-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.1.0

jobs:
  build:
    name: Release IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          brew install xcodegen
          python -m pip install --disable-pip-version-check pillow

      - name: Generate Dexter identity assets
        run: python Tools/generate_assets.py

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build environment
        run: |
          xcodebuild -version
          xcodegen --version
          python --version

      - name: Build Release app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project Dexter.xcodeproj \
            -scheme Dexter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee build/xcodebuild.log

      - name: Verify app metadata
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'Dexter.app' -print -quit)"
          test -n "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -qx 'com.jacckop1.dexter'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | grep -qx "$APP_VERSION"
          file "$APP_PATH/Dexter" | grep -q 'arm64'

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'Dexter.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/Dexter"

          rm -rf build/Payload
          mkdir -p build/Payload
          export COPYFILE_DISABLE=1
          cp -R "$APP_PATH" build/Payload/Dexter.app

          cd build
          /usr/bin/zip -qry "Dexter-v${APP_VERSION}-unsigned.ipa" Payload
          shasum -a 256 "Dexter-v${APP_VERSION}-unsigned.ipa" > "Dexter-v${APP_VERSION}-unsigned.sha256"
          unzip -t "Dexter-v${APP_VERSION}-unsigned.ipa"
          test -s "Dexter-v${APP_VERSION}-unsigned.ipa"

      - name: Upload Dexter IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-iOS-v${{ env.APP_VERSION }}
          path: |
            build/Dexter-v${{ env.APP_VERSION }}-unsigned.ipa
            build/Dexter-v${{ env.APP_VERSION }}-unsigned.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
