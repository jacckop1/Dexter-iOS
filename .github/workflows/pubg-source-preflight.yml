name: PUBG GL Source Preflight
on:
  push:
    branches: [main]
    paths:
      - "premium_telegram/pubg_source_preflight.py"
      - "premium_telegram/upload_pubg_gl.py"
      - "premium_telegram/fast_download.py"
      - "premium_telegram/pubg_targets.json"
      - "premium_telegram/test_metadata.py"
      - ".github/workflows/pubg-source-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r premium_telegram/requirements.txt
      - name: Test local Range recovery and Telegram retries
        run: python -m unittest discover -s premium_telegram -p 'test_*.py' -v
      - name: Probe GL source only without downloading IPA
        run: python premium_telegram/pubg_source_preflight.py
