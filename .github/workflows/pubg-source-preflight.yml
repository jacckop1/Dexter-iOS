name: PUBG Source Preflight
on:
  push:
    branches: [main]
    paths:
      - "premium_telegram/pubg_source_preflight.py"
      - "premium_telegram/upload_pubg_both.py"
      - "premium_telegram/uploader.py"
      - "premium_telegram/metadata.py"
      - "premium_telegram/pubg_targets.json"
      - ".github/workflows/pubg-source-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-remote-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r premium_telegram/requirements.txt
      - name: Test local Range recovery and Telegram part retries (no credentials)
        run: python -m unittest discover -s premium_telegram -p 'test_*.py' -v
      - name: Probe both sources without downloading large IPAs or using Telegram
        run: python premium_telegram/pubg_source_preflight.py
