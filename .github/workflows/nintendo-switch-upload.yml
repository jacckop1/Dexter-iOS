name: Nintendo Switch IPA to Saved Messages
run-name: "Nintendo Switch IPA: ${{ inputs.batch }}"

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Select which games to download and upload"
        required: true
        default: first_two
        type: choice
        options:
          - first_two
          - last_three
          - solateria
          - ready_or_nowhere
          - mario_vs_donkey_kong
          - cult_of_the_lamb
          - super_mario_3d_world

permissions:
  contents: read

concurrency:
  group: telegram-premium-one-off-switch
  cancel-in-progress: false

jobs:
  send-games:
    name: "Upload selected Switch IPAs - fast ranged downloads"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
      GAME_BATCH: ${{ inputs.batch }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r switch_uploader/requirements.txt

      - name: Offline tests
        run: python -m unittest discover -s switch_uploader -p 'test_*.py' -v

      - name: Upload chosen batch only
        run: python switch_uploader/upload.py
