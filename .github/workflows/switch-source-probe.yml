name: Switch Source Diagnostic (headers only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/switch-source-probe.yml"
      - "switch_uploader/source_probe.py"
      - "switch_uploader/games.json"
      - "switch_uploader/upload.py"
      - "switch_uploader/test_upload.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r switch_uploader/requirements.txt
      - name: Validate five games and both batches (no thumbnail)
        run: python -m unittest discover -s switch_uploader -p 'test_*.py' -v
      - name: Check only five IPA source ranges (no images or IPA downloads)
        run: python switch_uploader/source_probe.py
