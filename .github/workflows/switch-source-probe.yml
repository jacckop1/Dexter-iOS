name: Switch Source Diagnostic (headers only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/switch-source-probe.yml"
      - "switch_uploader/source_probe.py"
      - "switch_uploader/games.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pillow
      - name: Check Range responses for five links without downloading IPAs
        run: python switch_uploader/source_probe.py
